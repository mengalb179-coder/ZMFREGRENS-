<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZM Perfume & Collection | ZAKIR & Mengal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0b0b0b;
            background-image: url('1000069710.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #d4af37;
            padding: 20px;
        }
        header {
            text-align: center;
            padding: 30px 0;
            border-bottom: 2px solid #d4af37;
            margin-bottom: 30px;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 10px;
        }
        header h1 {
            font-size: 2.5rem;
            color: #f9d342;
            letter-spacing: 2px;
        }
        header p {
            color: #aaa;
            margin-top: 5px;
            font-size: 1.1rem;
        }
        .container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .card {
            background: rgba(20, 20, 20, 0.85);
            border: 1px solid #d4af37;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
            transition: transform 0.3s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .card:hover {
            transform: translateY(-5px);
        }
        .card img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-bottom: 1px solid #d4af37;
        }
        .card-content {
            padding: 15px;
            text-align: center;
        }
        .card-content h3 {
            font-size: 1.25rem;
            color: #fff;
            margin-bottom: 8px;
        }
        .badge {
            display: inline-block;
            background: #d4af37;
            color: #000;
            font-size: 0.75rem;
            font-weight: bold;
            padding: 3px 8px;
            border-radius: 4px;
            margin-bottom: 10px;
        }
        .price {
            font-size: 1.2rem;
            color: #f9d342;
            font-weight: bold;
            margin: 10px 0;
        }
        .wa-btn {
            display: block;
            width: 100%;
            background-color: #25d366;
            color: #fff;
            text-align: center;
            padding: 10px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 5px;
            transition: background 0.3s;
        }
        .wa-btn:hover {
            background-color: #1ebe5d;
        }
        footer {
            text-align: center;
            margin-top: 50px;
            padding: 20px;
            color: #ccc;
            border-top: 1px solid #d4af37;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <header>
        <h1>ZM PERFUME & COLLECTION</h1>
        <p>ZAKIR & MENGAL — Luxury Fragrances</p>
    </header>

    <div class="container" id="productGrid">
        <!-- Products will be loaded here -->
    </div>

    <footer>
        <p>&copy; 2026 ZM Perfume & Collection | ZAKIR & Mengal. All Rights Reserved.</p>
    </footer>

    <script>
        const products = [
            {
                name: "Asad & Khamra Ltafa",
                image: "1000069571.jpg",
                price: "$25.00",
                alcohol: "0 Alcohol"
            },
            {
                name: "White Musk",
                image: "1000069633.jpg",
                price: "$18.00",
                alcohol: "0 Alcohol"
            },
            {
                name: "Baqrate",
                image: "1000069632.jpg",
                price: "$30.00",
                alcohol: "0 Alcohol"
            },
            {
                name: "Janan Gold",
                image: "JANANGOLD100ml_2.jpg",
                price: "$22.00",
                alcohol: "0 Alcohol"
            },
            {
                name: "Khamra",
                image: "lattafa_khamrah_edp_100ml_1_1080x.jpg",
                price: "$28.00",
                alcohol: "0 Alcohol"
            },
            {
                name: "Shamsa",
                image: "1000069364.jpg",
                price: "$15.00",
                alcohol: "0 Alcohol"
            },
            {
                name: "Wait Oud",
                image: "whiteoud-03.jpg",
                price: "$24.00",
                alcohol: "0 Alcohol"
            },
            {
                name: "Oud Al Layl",
                image: "audallailcopy.jpg",
                price: "$29.00",
                alcohol: "0 Alcohol"
            },
            {
                name: "Baccarat Rouge",
                image: "baccarast-12.png",
                price: "$35.00",
                alcohol: "0 Alcohol"
            },
            {
                name: "Kareem",
                image: "1000069362.jpg",
                price: "$16.00",
                alcohol: "0 Alcohol"
            }
        ];

        const grid = document.getElementById('productGrid');
        const phoneNumber = "923357290695";

        products.forEach(p => {
            const message = encodeURIComponent(`Hello ZM Perfume & Collection, I want to order: ${p.name} (${p.price})`);
            const waLink = `https://wa.me/${phoneNumber}?text=${message}`;

            const card = `
                <div class="card">
                    <img src="${p.image}" alt="${p.name}">
                    <div class="card-content">
                        <span class="badge">${p.alcohol}</span>
                        <h3>${p.name}</h3>
                        <div class="price">${p.price}</div>
                        <a href="${waLink}" target="_blank" class="wa-btn">Order on WhatsApp</a>
                    </div>
                </div>
            `;
            grid.innerHTML += card;
        });
    </script>
</body>
</html>
