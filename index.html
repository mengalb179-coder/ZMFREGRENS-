<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfume Store</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f4; margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .product-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; }
        .product-card { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); text-align: center; }
        .product-card img { max-width: 100%; height: 200px; object-fit: cover; border-radius: 4px; }
        .admin-panel { background: white; padding: 20px; border-radius: 8px; margin-top: 30px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        input, button { padding: 10px; margin: 5px 0; width: 100%; box-sizing: border-box; }
        button { background: #28a745; color: white; border: none; cursor: pointer; border-radius: 4px; }
        button.delete-btn { background: #dc3545; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Perfume Store</h1>
            <button onclick="toggleAdmin()" style="width: auto;">Admin Panel</button>
        </div>

        <div class="product-grid" id="productGrid">
            <!-- Products will load here -->
        </div>

        <div class="admin-panel" id="adminPanel" style="display: none;">
            <h2>Admin Login / Add Product</h2>
            <div id="loginSection">
                <input type="password" id="adminPassword" placeholder="Enter Admin Password">
                <button onclick="loginAdmin()">Login</button>
            </div>
            
            <div id="addProductSection" style="display: none;">
                <h3>Add New Perfume</h3>
                <input type="text" id="perfumeName" placeholder="Perfume Name">
                <input type="number" id="perfumePricePkr" placeholder="Price in PKR">
                <input type="number" id="perfumePriceUsd" placeholder="Price in USD">
                <input type="file" id="perfumeImage" accept="image/*">
                <button onclick="addPerfume()">Save Product Online</button>
                <button onclick="logoutAdmin()" style="background: #6c757d;">Logout</button>
            </div>
        </div>
    </div>

    <script>
        const JSONBIN_API_KEY = '$2a$10$d3QbxfNLV.PiNAbuaFFa/.U6EFvtgFpt0fZkres1qsVXt5SdCjmq';
        const JSONBIN_BIN_ID = '6aa68542ac6210605ac790b8';
        const JSONBIN_URL = `https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}`;
        const WHATSAPP_NUMBER = '923357290695';

        // یہاں آپ اپنا خفیہ پاسورڈ سیٹ کر سکتے ہیں (مثال کے طور پر: 'ziad786')
        const DEFAULT_SECRET_PASS = '1234'; 

        let isAdminLoggedIn = false;

        async function loadProductsOnline() {
            try {
                const res = await fetch(JSONBIN_URL + '/latest', {
                    headers: { 'X-Master-Key': JSONBIN_API_KEY }
                });
                const data = await res.json();
                const perfumes = data.record.perfumes || [];
                renderProducts(perfumes);
            } catch (error) {
                console.error('Error loading products:', error);
            }
        }

        function renderProducts(perfumes) {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = '';
            perfumes.forEach((p, index) => {
                const waMessage = encodeURIComponent(`I want to order ${p.name} (PKR ${p.pkr} / USD ${p.usd})`);
                grid.innerHTML += `
                    <div class="product-card">
                        <img src="${p.image}" alt="${p.name}">
                        <h3>${p.name}</h3>
                        <p>PKR: ${p.pkr} | USD: ${p.usd}</p>
                        <a href="https://wa.me/${WHATSAPP_NUMBER}?text=${waMessage}" target="_blank">
                            <button style="background: #25D366;">Order on WhatsApp</button>
                        </a>
                        ${isAdminLoggedIn ? `<button class="delete-btn" onclick="deletePerfume(${index})">Delete</button>` : ''}
                    </div>
                `;
            });
        }

        function toggleAdmin() {
            const panel = document.getElementById('adminPanel');
            panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
        }

        async function loginAdmin() {
            const pass = document.getElementById('adminPassword').value;
            try {
                const res = await fetch(JSONBIN_URL + '/latest', {
                    headers: { 'X-Master-Key': JSONBIN_API_KEY }
                });
                const data = await res.json();
                // چیک کرے گا کہ ڈیٹا بیس میں پاسورڈ کیا سیٹ ہے، اگر نہیں تو const DEFAULT_SECRET_PASS = 'ziad_zakir_786'; 
استعمال کرے گا
                const savedPass = data.record.adminPass || DEFAULT_SECRET_PASS;

                if (pass === savedPass) {
                    isAdminLoggedIn = true;
                    document.getElementById('loginSection').style.display = 'none';
                    document.getElementById('addProductSection').style.display = 'block';
                    loadProductsOnline();
                } else {
                    alert('غلط پاسورڈ! براہ کرم درست پاسورڈ درج کریں۔');
                }
            } catch (err) {
                alert('لاگ ان میں مسئلہ آیا ہے، دوبارہ کوشش کریں۔');
            }
        }

        function logoutAdmin() {
            isAdminLoggedIn = false;
            document.getElementById('loginSection').style.display = 'block';
            document.getElementById('addProductSection').style.display = 'none';
            document.getElementById('adminPassword').value = '';
            loadProductsOnline();
        }

        function addPerfume() {
            const name = document.getElementById('perfumeName').value;
            const pkr = document.getElementById('perfumePricePkr').value;
            const usd = document.getElementById('perfumePriceUsd').value;
            const imageFile = document.getElementById('perfumeImage').files[0];

            if (!name || !pkr || !usd || !imageFile) {
                alert('براہ کرم تمام خلیے (Fields) پُر کریں!');
                return;
            }

            const reader = new FileReader();
            reader.onload = async function(e) {
                const base64Image = e.target.result;

                const res = await fetch(JSONBIN_URL + '/latest', {
                    headers: { 'X-Master-Key': JSONBIN_API_KEY }
                });
                const currentData = await res.json();
                let perfumes = currentData.record.perfumes || [];
                let adminPass = currentData.record.adminPass || DEFAULT_SECRET_PASS;

                perfumes.push({
                    name: name,
                    pkr: pkr,
                    usd: usd,
                    image: base64Image
                });

                await fetch(JSONBIN_URL, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Master-Key': JSONBIN_API_KEY
                    },
                    body: JSON.stringify({ 
                        perfumes: perfumes,
                        adminPass: adminPass 
                    })
                });

                alert('پروڈکٹ آن لائن محفوظ کر دی گئی ہے!');
                document.getElementById('perfumeName').value = '';
                document.getElementById('perfumePricePkr').value = '';
                document.getElementById('perfumePriceUsd').value = '';
                document.getElementById('perfumeImage').value = '';
                loadProductsOnline();
            };
            reader.readAsDataURL(imageFile);
        }

        async function deletePerfume(index) {
            const res = await fetch(JSONBIN_URL + '/latest', {
                headers: { 'X-Master-Key': JSONBIN_API_KEY }
            });
            const currentData = await res.json();
            let perfumes = currentData.record.perfumes || [];
            let adminPass = currentData.record.adminPass || DEFAULT_SECRET_PASS;
            perfumes.splice(index, 1);

            await fetch(JSONBIN_URL, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Master-Key': JSONBIN_API_KEY
                },
                body: JSON.stringify({ 
                    perfumes: perfumes,
                    adminPass: adminPass 
                })
            });

            alert('پروڈکٹ ڈیلیٹ کر دی گئی ہے!');
            loadProductsOnline();
        }

        window.onload = function() {
            loadProductsOnline();
        };
    </script>
</body>
</html>
