<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZM Perfume & Collection | ZAKIR & Mengal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #050d1a;
            background-image: linear-gradient(rgba(5, 13, 26, 0.75), rgba(5, 13, 26, 0.85)), url('https://images.unsplash.com/photo-1547887537-6158d64c35b3?q=80&w=1920&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #d4af37;
            padding: 20px;
        }
        header {
            text-align: center;
            padding: 30px 0;
            border-bottom: 2px solid #d4af37;
            margin-bottom: 30px;
            background: rgba(0, 0, 0, 0.85);
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
        }
        header h1 {
            font-size: 2.5rem;
            color: #f9d342;
            letter-spacing: 2px;
        }
        header p {
            color: #aaa;
            margin-top: 5px;
            font-size: 1.1rem;
        }
        .container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .card {
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid #d4af37;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
            transition: transform 0.3s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .card:hover {
            transform: translateY(-5px);
        }
        .card img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-bottom: 1px solid #d4af37;
        }
        .card-content {
            padding: 15px;
            text-align: center;
        }
        .card-content h3 {
            font-size: 1.25rem;
            color: #fff;
            margin-bottom: 8px;
        }
        .badge {
            display: inline-block;
            background: #d4af37;
            color: #000;
            font-size: 0.75rem;
            font-weight: bold;
            padding: 3px 8px;
            border-radius: 4px;
            margin-bottom: 10px;
        }
        .price {
            font-size: 1.2rem;
            color: #f9d342;
            font-weight: bold;
            margin: 10px 0;
        }
        .wa-btn {
            display: block;
            width: 100%;
            background-color: #25d366;
            color: #fff;
            text-align: center;
            padding: 10px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 5px;
            transition: background 0.3s;
        }
        .wa-btn:hover {
            background-color: #1ebe5d;
        }
        /* Admin Login & Add Panel Styling (Hidden by default) */
        .admin-box {
            max-width: 500px;
            margin: 30px auto;
            background: rgba(10, 15, 25, 0.95);
            border: 2px solid #d4af37;
            border-radius: 10px;
            padding: 20px;
            display: none;
        }
        .admin-box h2 {
            text-align: center;
            color: #f9d342;
            margin-bottom: 15px;
            font-size: 1.3rem;
        }
        .admin-box input {
            width: 100%;
            padding: 10px;
            margin-bottom: 12px;
            background: #111827;
            border: 1px solid #d4af37;
            color: #fff;
            border-radius: 5px;
        }
        .admin-btn {
            width: 100%;
            padding: 10px;
            background: #d4af37;
            color: #000;
            font-weight: bold;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .checkbox-container {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
            color: #fff;
            font-size: 0.9rem;
            cursor: pointer;
        }
        .hidden {
            display: none;
        }
        footer {
            text-align: center;
            margin-top: 50px;
            padding: 20px;
            color: #ccc;
            border-top: 1px solid #d4af37;
            background: rgba(0, 0, 0, 0.85);
            border-radius: 10px;
            position: relative;
        }
        .secret-admin-btn {
            position: absolute;
            right: 15px;
            bottom: 15px;
            background: transparent;
            border: none;
            color: #555;
            cursor: pointer;
            font-size: 14px;
        }
        .secret-admin-btn:hover {
            color: #d4af37;
        }
    </style>
</head>
<body>

    <header>
        <h1>ZM PERFUME & COLLECTION</h1>
        <p>ZAKIR & MENGAL — Luxury Fragrances</p>
    </header>

    <div class="container" id="productGrid">
        <!-- Products will be loaded here -->
    </div>

    <!-- Hidden/Secret Admin Login Box -->
    <div class="admin-box" id="loginBox">
        <h2>Admin Login</h2>
        <input type="password" id="adminPassInput" placeholder="Enter Password (admin123)" required>
        <label class="checkbox-container">
            <input type="checkbox" id="showPassCheck" onclick="togglePasswordVisibility()"> Show Password
        </label>
        <button class="admin-btn" onclick="checkAdminPassword()">Login</button>
    </div>

    <!-- Add Product Panel (opens after login) -->
    <div class="admin-box hidden" id="adminPanel">
        <h2>Add New Product (Admin)</h2>
        <div class="admin-form">
            <input type="text" id="pName" placeholder="Product Name (e.g. Royal Oud)" required>
            <input type="text" id="pImage" placeholder="Image File Name (e.g. 1000069571.jpg)" required>
            <input type="text" id="pPrice" placeholder="Price (e.g. $25.00)" required>
            <input type="text" id="pAlcohol" placeholder="Alcohol Tag (e.g. 0 Alcohol)" value="0 Alcohol">
            <button class="admin-btn" onclick="addNewProduct()">Add Product to Website</button>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 ZM Perfume & Collection | ZAKIR & Mengal. All Rights Reserved.</p>
        <!-- Secret small icon in footer to open admin login -->
        <button class="secret-admin-btn" onclick="toggleSecretLogin()" title="Admin">🔒</button>
    </footer>

    <script>
        const defaultProducts = [
            {
                name: "Asad & Khamra Ltafa",
                image: "Mens_3fb70373-97d6-4a91-94c6-bbbbe55b8c56.jpg",
                price: "$25.00",
                alcohol: "0 Alcohol"
            },
            {
                name: "White Musk",
                image: "1000069633.jpg",
                price: "$18.00",
                alcohol: "0 Alcohol"
            },
            {
                name: "Baqrate",
                image: "1000069632.jpg",
                price: "$30.00",
                alcohol: "0 Alcohol"
            },
            {
                name: "Janan Gold",
                image: "JANANGOLD100ml_2.jpg",
                price: "$22.00",
                alcohol: "0 Alcohol"
            },
            {
                name: "Khamra",
                image: "lattafa_khamrah_edp_100ml_1_1080x.jpg",
                price: "$28.00",
                alcohol: "0 Alcohol"
            },
            {
                name: "Shamsa",
                image: "1000069364.jpg",
                price: "$15.00",
                alcohol: "0 Alcohol"
            },
            {
                name: "Wait Oud",
                image: "whiteoud-03.jpg",
                price: "$24.00",
                alcohol: "0 Alcohol"
            },
            {
                name: "Oud Al Layl",
                image: "audallailcopy.jpg",
                price: "$29.00",
                alcohol: "0 Alcohol"
            },
            {
                name: "Baccarat Rouge",
                image: "baccarast-12.png",
                price: "$35.00",
                alcohol: "0 Alcohol"
            },
            {
                name: "Kareem",
                image: "1000069362.jpg",
                price: "$16.00",
                alcohol: "0 Alcohol"
            }
        ];

        let products = JSON.parse(localStorage.getItem('zmProducts')) || defaultProducts;

        function renderProducts() {
            const grid = document.getElementById('productGrid');
            const phoneNumber = "923357290695";
            grid.innerHTML = '';

            products.forEach(p => {
                const message = encodeURIComponent(`Hello ZM Perfume & Collection, I want to order: ${p.name}`);
                const waLink = `https://wa.me/${phoneNumber}?text=${message}`;

                const card = `
                    <div class="card">
                        <img src="${p.image}" alt="${p.name}">
                        <div class="card-content">
                            <span class="badge">${p.alcohol}</span>
                            <h3>${p.name}</h3>
                            <div class="price">${p.price}</div>
                            <a href="${waLink}" target="_blank" class="wa-btn">Order on WhatsApp</a>
                        </div>
                    </div>
                `;
                grid.innerHTML += card;
            });
        }

        function toggleSecretLogin() {
            const loginBox = document.getElementById('loginBox');
            if (loginBox.style.display === 'block') {
                loginBox.style.display = 'none';
            } else {
                loginBox.style.display = 'block';
            }
        }

        function togglePasswordVisibility() {
            const passInput = document.getElementById('adminPassInput');
            const showCheck = document.getElementById('showPassCheck');
            if (showCheck.checked) {
                passInput.type = 'text';
            } else {
                passInput.type = 'password';
            }
        }

        function checkAdminPassword() {
            const pass = document.getElementById('adminPassInput').value;
            if (pass === "admin123") {
                document.getElementById('loginBox').style.display = 'none';
                document.getElementById('adminPanel').classList.remove('hidden');
                alert("Login Successful! You can now add products.");
            } else {
                alert("Wrong Password! Please try again.");
            }
        }

        function addNewProduct() {
            const name = document.getElementById('pName').value.trim();
            const image = document.getElementById('pImage').value.trim();
            const price = document.getElementById('pPrice').value.trim();
            const alcohol = document.getElementById('pAlcohol').value.trim();

            if (!name || !image || !price) {
                alert("Please fill all required fields!");
                return;
            }

            const newProd = { name, image, price, alcohol };
            products.push(newProd);
            localStorage.setItem('zmProducts', JSON.stringify(products));

            renderProducts();
            alert("New Product Added Successfully!");

            document.getElementById('pName').value = '';
            document.getElementById('pImage').value = '';
            document.getElementById('pPrice').value = '';
        }

        renderProducts();
    </script>
</body>
</html>
