<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZM Perfume & Collection | ZAKIR & Mengal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #050d1a;
            color: #d4af37;
            padding: 20px;
        }
        header {
            text-align: center;
            padding: 30px 0;
            border-bottom: 2px solid #d4af37;
            margin-bottom: 30px;
            background: rgba(0, 0, 0, 0.85);
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
        }
        header h1 {
            font-size: 2.5rem;
            color: #f9d342;
            letter-spacing: 2px;
        }
        header p {
            color: #aaa;
            margin-top: 5px;
            font-size: 1.1rem;
        }
        .container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .card {
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid #d4af37;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
            transition: transform 0.3s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .card:hover {
            transform: translateY(-5px);
        }
        .card img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-bottom: 1px solid #d4af37;
            background-color: #0b0c10;
        }
        .card-content {
            padding: 15px;
            text-align: center;
        }
        .card-content h3 {
            font-size: 1.25rem;
            color: #fff;
            margin-bottom: 8px;
        }
        .badge {
            display: inline-block;
            background: #d4af37;
            color: #000;
            font-size: 0.75rem;
            font-weight: bold;
            padding: 3px 8px;
            border-radius: 4px;
            margin-bottom: 10px;
        }
        .price {
            font-size: 1.2rem;
            color: #f9d342;
            font-weight: bold;
            margin: 10px 0;
        }
        .wa-btn {
            display: block;
            width: 100%;
            background-color: #25d366;
            color: #fff;
            text-align: center;
            padding: 10px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 5px;
            transition: background 0.3s;
        }
        .wa-btn:hover {
            background-color: #1ebe5d;
        }
        footer {
            text-align: center;
            margin-top: 50px;
            padding: 20px;
            color: #ccc;
            border-top: 1px solid #d4af37;
            background: rgba(0, 0, 0, 0.85);
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <header>
        <h1>ZM PERFUME & COLLECTION</h1>
        <p>ZAKIR & MENGAL — Luxury Fragrances</p>
    </header>

    <div class="container" id="productGrid">
        <!-- Products will be loaded here -->
    </div>

    <footer>
        <p>&copy; 2026 ZM Perfume & Collection | ZAKIR & Mengal. All Rights Reserved.</p>
    </footer>

    <script>
        const products = [
            {
                name: "Asad & Khamra Ltafa",
                image: "https://images.unsplash.com/photo-1592945403244-b3fbafd7f539?auto=format&fit=crop&w=800&q=80",
                price: "$25.00",
                alcohol: "0 Alcohol"
            },
            {
                name: "White Musk",
                image: "https://images.unsplash.com/photo-1523293182086-7651a899d37f?auto=format&fit=crop&w=800&q=80",
                price: "$18.00",
                alcohol: "0 Alcohol"
            },
            {
                name: "Baqrate",
                image: "https://images.unsplash.com/photo-1547887537-6158d64c35b3?auto=format&fit=crop&w=800&q=80",
                price: "$30.00",
                alcohol: "0 Alcohol"
            },
            {
                name: "Shamsa",
                image: "https://images.unsplash.com/photo-1594035910387-fea47794261f?auto=format&fit=crop&w=800&q=80",
                price: "$15.00",
                alcohol: "0 Alcohol"
            },
            {
                name: "Janan Gold",
                image: "https://images.unsplash.com/photo-1588405748880-12d1d2a59f75?auto=format&fit=crop&w=800&q=80",
                price: "$22.00",
                alcohol: "0 Alcohol"
            },
            {
                name: "Khamra",
                image: "https://images.unsplash.com/photo-1523293182086-7651a899d37f?auto=format&fit=crop&w=800&q=80",
                price: "$28.00",
                alcohol: "0 Alcohol"
            },
            {
                name: "Udelel",
                image: "https://images.unsplash.com/photo-1547887537-6158d64c35b3?auto=format&fit=crop&w=800&q=80",
                price: "$26.00",
                alcohol: "0 Alcohol"
            },
            {
                name: "Wait Oud",
                image: "https://images.unsplash.com/photo-1592945403244-b3fbafd7f539?auto=format&fit=crop&w=800&q=80",
                price: "$24.00",
                alcohol: "0 Alcohol"
            },
            {
                name: "Ameerel Oud",
                image: "https://images.unsplash.com/photo-1594035910387-fea47794261f?auto=format&fit=crop&w=800&q=80",
                price: "$27.00",
                alcohol: "0 Alcohol"
            },
            {
                name: "Kareem",
                image: "https://images.unsplash.com/photo-1588405748880-12d1d2a59f75?auto=format&fit=crop&w=800&q=80",
                price: "$20.00",
                alcohol: "0 Alcohol"
            }
        ];

        function renderProducts() {
            const grid = document.getElementById('productGrid');
            const phoneNumber = "923357290695";
            grid.innerHTML = '';

            products.forEach(p => {
                const message = encodeURIComponent(`Hello ZM Perfume & Collection, I want to order: ${p.name} (${p.price})`);
                const waLink = `https://wa.me/${phoneNumber}?text=${message}`;

                const card = `
                    <div class="card">
                        <img src="${p.image}" alt="${p.name}">
                        <div class="card-content">
                            <span class="badge">${p.alcohol}</span>
                            <h3>${p.name}</h3>
                            <div class="price">${p.price}</div>
                            <a href="${waLink}" target="_blank" class="wa-btn">Order on WhatsApp</a>
                        </div>
                    </div>
                `;
                grid.innerHTML += card;
            });
        }

        renderProducts();
    </script>
</body>
</html>
