<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZM PERFUME & COLLECTION</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #0b0c10;
            color: #fff;
            padding: 15px;
        }
        .header {
            background: linear-gradient(135deg, #1f2833, #0b0c10);
            border: 2px solid #d4af37;
            border-radius: 10px;
            text-align: center;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
        }
        .header h1 {
            color: #d4af37;
            font-size: 24px;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }
        .header p {
            color: #c5c6c7;
            font-size: 14px;
        }
        .product-card {
            background-color: #1f2833;
            border: 1px solid #d4af37;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .product-image {
            width: 100%;
            height: 250px;
            object-fit: cover;
            background-color: #0b0c10;
        }
        .product-info {
            padding: 15px;
            text-align: center;
        }
        .badge {
            background-color: #d4af37;
            color: #0b0c10;
            font-size: 11px;
            font-weight: bold;
            padding: 4px 10px;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 8px;
        }
        .product-name {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 8px;
            color: #fff;
        }
        .product-price {
            font-size: 16px;
            color: #d4af37;
            font-weight: bold;
            margin-bottom: 12px;
        }
        .whatsapp-btn {
            display: block;
            width: 100%;
            background-color: #25D366;
            color: #000;
            text-align: center;
            padding: 12px;
            font-weight: bold;
            text-decoration: none;
            border-radius: 8px;
            font-size: 15px;
            transition: background 0.3s;
        }
        .whatsapp-btn:hover {
            background-color: #20bd5a;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>ZM PERFUME & COLLECTION</h1>
        <p>ZAKIR & MENGAL — Luxury Fragrances</p>
    </div>

    <!-- Product 1 -->
    <div class="product-card">
        <img class="product-image" src="https://images.unsplash.com/photo-1592945403244-b3fbafd7f539?auto=format&fit=crop&w=800&q=80" alt="Asad & Khamra Ltafa">
        <div class="product-info">
            <span class="badge">0 Alcohol</span>
            <div class="product-name">Asad & Khamra Ltafa</div>
            <div class="product-price">$25.00</div>
            <a href="https://wa.me/923357290695?text=I%20want%20to%20order%20Asad%20&%20Khamra%20Ltafa%20($25.00)" class="whatsapp-btn">Order on WhatsApp</a>
        </div>
    </div>

    <!-- Product 2 -->
    <div class="product-card">
        <img class="product-image" src="https://images.unsplash.com/photo-1523293182086-7651a899d37f?auto=format&fit=crop&w=800&q=80" alt="White Musk">
        <div class="product-info">
            <span class="badge">0 Alcohol</span>
            <div class="product-name">White Musk</div>
            <div class="product-price">$18.00</div>
            <a href="https://wa.me/923357290695?text=I%20want%20to%20order%20White%20Musk%20($18.00)" class="whatsapp-btn">Order on WhatsApp</a>
        </div>
    </div>

    <!-- Product 3 -->
    <div class="product-card">
        <img class="product-image" src="https://images.unsplash.com/photo-1547887537-6158d64c35b3?auto=format&fit=crop&w=800&q=80" alt="Baqrate">
        <div class="product-info">
            <span class="badge">0 Alcohol</span>
            <div class="product-name">Baqrate</div>
            <div class="product-price">$30.00</div>
            <a href="https://wa.me/923357290695?text=I%20want%20to%20order%20Baqrate%20($30.00)" class="whatsapp-btn">Order on WhatsApp</a>
        </div>
    </div>

</body>
</html>
