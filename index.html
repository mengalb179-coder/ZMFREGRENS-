<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZM Collection & Watches | Original Collection</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', 'Noto Nastaliq Urdu', sans-serif; }
        body { background-color: #0f172a; color: #ffffff; direction: ltr; }
        header { background: #1e293b; padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 10px rgba(0,0,0,0.3); position: sticky; top: 0; z-index: 100; }
        .logo { font-size: 22px; font-weight: 700; color: #f59e0b; letter-spacing: 1px; }
        .hero { text-align: center; padding: 30px 20px; background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%); }
        .hero h1 { font-size: 26px; margin-bottom: 10px; color: #f8fafc; }
        .hero p { color: #94a3b8; font-size: 14px; }
        .container { max-width: 1200px; margin: 20px auto; padding: 0 15px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; }
        .card { background: #1e293b; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.2); transition: transform 0.3s; border: 1px solid #334155; }
        .card:hover { transform: translateY(-5px); }
        .card img { width: 100%; height: 220px; object-fit: cover; background: #334155; }
        .card-content { padding: 15px; text-align: center; }
        .card-title { font-size: 18px; font-weight: 600; color: #f8fafc; margin-bottom: 8px; }
        .card-price { font-size: 16px; color: #f59e0b; font-weight: 700; margin-bottom: 12px; }
        .whatsapp-btn { display: block; background-color: #25d366; color: white; padding: 10px; border-radius: 6px; text-decoration: none; font-weight: 600; font-size: 14px; transition: background 0.3s; }
        .whatsapp-btn:hover { background-color: #20ba5a; }
    </style>
</head>
<body>

    <header>
        <div class="logo">ZM Collection</div>
    </header>

    <div class="hero">
        <h1>خوش آمدید! عطر، پرفیومز اور گھڑیاں</h1>
        <p>پریمیم کوالٹی کی پراڈکٹس اب آپ کی دسترس میں</p>
    </div>

    <div class="container">
        <div id="product-grid" class="grid">
            <!-- Products and Watches will load dynamically -->
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD...",
            authDomain: "zmCollection77e8a.firebaseapp.com",
            projectId: "zmfregrens-77e8a",
            storageBucket: "zmfregrens-77e8a.appspot.com",
            messagingSenderId: "367121774362",
            appId: "1:367121774362:web:..."
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        async function loadProducts() {
            const grid = document.getElementById('product-grid');
            try {
                const querySnapshot = await getDocs(collection(db, "udula"));
                grid.innerHTML = "";
                
                if (querySnapshot.empty) {
                    grid.innerHTML = "<p style='text-align:center; grid-column:1/-1; color:#94a3b8;'>کوئی پروڈکٹ یا گھڑی موجود نہیں ہے۔</p>";
                    return;
                }

                querySnapshot.forEach((doc) => {
                    const product = doc.data();
                    const card = document.createElement('div');
                    card.className = 'card';
                    
                    const displayName = "ZM " + (product.name || "Item");
                    const displayPrice = product.price ? "Rs. " + product.price : "Price on request";
                    const displayImage = product.image || "https://via.placeholder.com/250";
                    
                    const whatsappMessage = encodeURIComponent(`سلام! میں یہ آرڈر کرنا چاہتا ہوں: ${displayName} (${displayPrice})`);

                    card.innerHTML = `
                        <img src="${displayImage}" alt="${displayName}">
                        <div class="card-content">
                            <div class="card-title">${displayName}</div>
                            <div class="card-price">${displayPrice}</div>
                            <a href="https://wa.me/923357290695?text=${whatsappMessage}" target="_blank" class="whatsapp-btn">WhatsApp پر آرڈر کریں</a>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            } catch (error) {
                console.error("Error loading products: ", error);
                grid.innerHTML = "<p style='text-align:center; grid-column:1/-1; color:#ef4444;'>ڈیٹا لوڈ کرنے میں مسئلہ پیش آیا ہے۔</p>";
            }
        }

        loadProducts();
    </script>
</body>
</html>
