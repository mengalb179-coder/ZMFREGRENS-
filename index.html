<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZM Perfume & Collection</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        h1 {
            color: #222;
            margin-bottom: 5px;
        }
        p {
            color: #666;
            margin-bottom: 30px;
        }
        .container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 20px;
-           max-width: 1200px;
            margin: 0 auto;
        }
        .card {
            background: #ffffff;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            transition: transform 0.2s ease;
        }
        .card:hover {
            transform: translateY(-5px);
        }
        .card img {
            width: 100%;
            height: 240px;
            object-fit: cover;
            border-radius: 8px;
        }
        .card h3 {
            margin: 12px 0 5px;
            font-size: 18px;
            color: #333;
        }
        .price {
            color: #b8860b;
            font-weight: bold;
            font-size: 16px;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <h1>ZM Perfume & Collection</h1>
    <p>خوش آمدید! ہمارے بہترین پرفیومز اور عطر کا مجموعہ ملاحظہ کریں</p>

    <div class="container">
        <!-- 1 -->
        <div class="card">
            <img src="lattafa_khamrah_edp_100ml_1_1080x.jpg" alt="Khamrah Lattafa">
            <h3>Khamrah Lattafa</h3>
            <div class="price">Rs. 4,000</div>
        </div>

        <!-- 2 -->
        <div class="card">
            <img src="baccarast-12.png" alt="Baccarat">
            <h3>Baccarat Special Edition</h3>
            <div class="price">Rs. 3,200</div>
        </div>

        <!-- 3 -->
        <div class="card">
            <img src="audallailcopy.jpg" alt="Oud Al Lail">
            <h3>Oud Al Lail Impression</h3>
            <div class="price">Rs. 2,500</div>
        </div>

        <!-- 4 -->
        <div class="card">
            <img src="janan_30ml.webp" alt="Janan Gold">
            <h3>Janan Gold Edition</h3>
            <div class="price">Rs. 4,500</div>
        </div>

        <!-- 5 -->
        <div class="card">
            <img src="whiteoud-03.jpg" alt="White Oud">
            <h3>White Oud Attar</h3>
            <div class="price">Rs. 1,800</div>
        </div>
    </div>

</body>
</html>
