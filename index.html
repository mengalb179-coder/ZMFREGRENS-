<!DOCTYPE html>
<html lang="ur" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZM — Zakir Mengal Paris | Luxury Fragrances</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Inter:wght@300;400;500;600&family=Noto+Nastaliq+Urdu:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#efe8d8;
    --ink-dim:#c9bfa8;
    --bg:#141110;
    --bg-deep:#0d0b0a;
    --panel:#1c1815;
    --gold:#c9a227;
    --gold-soft:#a9852f;
    --wine:#5c1420;
    --line: rgba(201,162,39,0.28);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter', sans-serif;
    font-weight:300;
    line-height:1.6;
    overflow-x:hidden;
  }
  .urdu{ font-family:'Noto Nastaliq Urdu', serif; direction:rtl; }
  h1,h2,h3,.serif{ font-family:'Playfair Display', serif; }
  a{ color:inherit; text-decoration:none; }
  img{ display:block; max-width:100%; }

  /* ===== Top bar ===== */
  .topbar{
    position:fixed; top:0; left:0; right:0; z-index:50;
    display:flex; align-items:center; justify-content:space-between;
    padding:20px 6vw;
    background:linear-gradient(to bottom, rgba(13,11,10,0.92), rgba(13,11,10,0));
    transition:background .3s;
  }
  .topbar.scrolled{ background:rgba(13,11,10,0.92); border-bottom:1px solid var(--line); }
  .brand-mark{ font-family:'Playfair Display', serif; font-size:22px; letter-spacing:2px; color:var(--gold); }
  .brand-mark span{ color:var(--ink); font-size:13px; letter-spacing:3px; display:block; font-family:'Inter'; margin-top:2px;}
  .topbar nav a{ font-size:13px; letter-spacing:1.5px; color:var(--ink-dim); margin-inline-start:28px; }
  .topbar nav a:hover{ color:var(--gold); }

  /* ===== Hero ===== */
  .hero{
    position:relative; min-height:100vh; display:flex; align-items:flex-end;
    background:#000;
  }
  .hero-img{
    position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:center 30%;
    opacity:0.78;
  }
  .hero::after{
    content:''; position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(13,11,10,0.15) 0%, rgba(13,11,10,0.35) 55%, rgba(13,11,10,0.97) 100%);
  }
  .hero-content{ position:relative; z-index:2; padding:0 6vw 90px; max-width:640px; }
  .hero-eyebrow{ color:var(--gold); font-size:13px; letter-spacing:4px; margin-bottom:18px;}
  .hero h1{ font-size:clamp(38px,6vw,68px); font-weight:500; line-height:1.08; color:var(--ink);}
  .hero h1 em{ font-style:italic; color:var(--gold);}
  .hero p{ margin-top:20px; color:var(--ink-dim); font-size:16px; max-width:460px;}
  .hero-cta{ margin-top:34px; display:flex; gap:16px; flex-wrap:wrap;}
  .btn{
    display:inline-flex; align-items:center; gap:10px;
    padding:15px 30px; font-size:13px; letter-spacing:1.5px;
    border:1px solid var(--gold); color:var(--gold);
    transition:all .25s;
  }
  .btn:hover{ background:var(--gold); color:var(--bg-deep); }
  .btn.solid{ background:var(--gold); color:var(--bg-deep); }
  .btn.solid:hover{ background:transparent; color:var(--gold); }

  /* ===== Section headers ===== */
  .section{ padding:100px 6vw; }
  .section-head{ margin-bottom:60px; max-width:640px; }
  .section-head .tag{ color:var(--gold); font-size:12px; letter-spacing:3px; margin-bottom:14px; }
  .section-head h2{ font-size:clamp(28px,3.4vw,42px); font-weight:500; }
  .section-head p{ color:var(--ink-dim); margin-top:16px; font-size:15px; }

  /* ===== Product grid ===== */
  .grid{
    display:grid; grid-template-columns:repeat(auto-fit, minmax(300px,1fr));
    gap:1px; background:var(--line); border:1px solid var(--line);
  }
  .card{
    background:var(--bg); padding:0; position:relative; display:flex; flex-direction:column;
  }
  .card-media{ position:relative; aspect-ratio:4/5; overflow:hidden; background:#000; }
  .card-media img{ width:100%; height:100%; object-fit:cover; transition:transform .6s ease; }
  .card:hover .card-media img{ transform:scale(1.05); }
  .card-body{ padding:26px 28px 30px; border-top:1px solid var(--line); flex:1; display:flex; flex-direction:column;}
  .card-eyebrow{ font-size:11px; letter-spacing:2px; color:var(--gold-soft); margin-bottom:8px;}
  .card h3{ font-size:22px; font-weight:500; color:var(--ink);}
  .card .desc{ color:var(--ink-dim); font-size:13.5px; margin-top:10px; flex:1; }
  .card-footer{ display:flex; align-items:flex-end; justify-content:space-between; margin-top:22px; gap:12px; flex-wrap:wrap;}
  .price{ line-height:1.3; }
  .price .pkr{ font-family:'Playfair Display', serif; font-size:22px; color:var(--gold); }
  .price .usd{ font-size:12px; color:var(--ink-dim); letter-spacing:.5px; }
  .order-link{
    font-size:12px; letter-spacing:1px; color:var(--ink);
    border:1px solid var(--line); padding:10px 18px;
    display:inline-flex; align-items:center; gap:8px; white-space:nowrap;
    transition:all .25s;
  }
  .order-link:hover{ border-color:var(--gold); color:var(--gold); }
  .order-link svg{ width:14px; height:14px; fill:currentColor; }

  /* ===== Trust strip ===== */
  .strip{
    display:flex; flex-wrap:wrap; gap:40px; justify-content:space-between;
    padding:50px 6vw; border-top:1px solid var(--line); border-bottom:1px solid var(--line);
    background:var(--panel);
  }
  .strip .item{ flex:1; min-width:180px; }
  .strip .item .num{ font-family:'Playfair Display', serif; color:var(--gold); font-size:26px; margin-bottom:6px;}
  .strip .item .lbl{ font-size:12.5px; color:var(--ink-dim); letter-spacing:.5px; }

  /* ===== Order / contact ===== */
  .order-section{
    padding:110px 6vw; text-align:center; position:relative;
    background:radial-gradient(circle at 50% 0%, rgba(201,162,39,0.08), transparent 60%);
  }
  .order-section h2{ font-size:clamp(28px,4vw,44px); font-weight:500; max-width:700px; margin:0 auto; }
  .order-section p{ color:var(--ink-dim); max-width:520px; margin:20px auto 0; font-size:15px;}
  .urdu-note{ margin-top:26px; font-size:19px; color:var(--ink); line-height:2.1; }
  .whatsapp-big{
    margin-top:40px; display:inline-flex; align-items:center; gap:14px;
    padding:19px 44px; background:var(--gold); color:var(--bg-deep);
    font-size:16px; letter-spacing:1px; font-weight:500;
  }
  .whatsapp-big:hover{ background:var(--ink); }
  .whatsapp-big svg{ width:22px; height:22px; fill:currentColor; }
  .wa-number{ margin-top:18px; color:var(--gold-soft); letter-spacing:2px; font-size:14px; }

  /* ===== Floating WhatsApp button ===== */
  .float-wa{
    position:fixed; bottom:26px; right:26px; z-index:60;
    width:58px; height:58px; border-radius:50%;
    background:#1f9e56; display:flex; align-items:center; justify-content:center;
    box-shadow:0 6px 20px rgba(0,0,0,.45);
  }
  .float-wa svg{ width:28px; height:28px; fill:#fff; }

  /* ===== Footer ===== */
  footer{
    padding:50px 6vw 40px; border-top:1px solid var(--line);
    display:flex; flex-wrap:wrap; justify-content:space-between; gap:20px;
    color:var(--ink-dim); font-size:13px;
  }
  footer .brand-mark{ margin-bottom:6px; }

  @media(max-width:640px){
    .section{ padding:70px 6vw; }
    .strip{ padding:40px 6vw; gap:26px;}
  }
</style>
</head>

  </nav>
