<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZM Fragrances | Zakir & Mengal</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            background: #050b14 url('1000069710.jpg') no-repeat center center fixed; 
            background-size: cover; 
            color: #fff;
            margin: 0; 
            padding: 20px; 
        }
        .container { max-width: 1200px; margin: auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; background: rgba(10, 20, 35, 0.85); padding: 15px 20px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,229,255,0.2); border: 1px solid rgba(0,229,255,0.3); }
        .header h1 { margin: 0; font-size: 24px; color: #00e5ff; text-shadow: 0 0 10px rgba(0,229,255,0.5); }
        .admin-toggle-btn { background: #00e5ff; color: #050b14; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; font-size: 14px; font-weight: bold; }
        
        .product-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; }
        .product-card { background: rgba(10, 20, 35, 0.85); padding: 15px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); border: 1px solid rgba(0,229,255,0.3); text-align: center; display: flex; flex-direction: column; justify-content: space-between; }
        .product-card img { max-width: 100%; height: 220px; object-fit: cover; border-radius: 6px; margin-bottom: 10px; }
        .product-card h3 { margin: 10px 0 2px 0; font-size: 18px; color: #fff; }
        .alcohol-tag { color: #00ff66; font-size: 13px; font-weight: bold; margin-bottom: 8px; }
        .product-card p { margin: 5px 0 15px 0; color: #00e5ff; font-weight: bold; }
        
        .order-btn { background: #25D366; color: white; text-decoration: none; padding: 10px; border-radius: 4px; display: block; font-weight: bold; margin-bottom: 5px; }
        .delete-btn { background: #dc3545; color: white; border: none; padding: 8px; border-radius: 4px; cursor: pointer; width: 100%; margin-top: 5px; }

        .admin-panel { background: rgba(10, 20, 35, 0.95); padding: 20px; border-radius: 8px; margin-top: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.6); border: 1px solid rgba(0,229,255,0.4); display: none; color: #fff; }
        .admin-panel h2, .admin-panel h3 { color: #00e5ff; }
        input, button.action-btn { padding: 10px; margin: 8px 0; width: 100%; box-sizing: border-box; border-radius: 4px; border: 1px solid rgba(0,229,255,0.3); background: #0b162c; color: #fff; }
        button.action-btn { background: #00e5ff; color: #050b14; border: none; cursor: pointer; font-weight: bold; }
        button.logout-btn { background: #6c757d; color: white; border: none; cursor: pointer; }
        .or-text { text-align: center; font-weight: bold; color: #00e5ff; margin: 5px 0; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>ZM Fragrances | Zakir & Mengal</h1>
            <button class="admin-toggle-btn" onclick="toggleAdminPanel()">Admin Panel</button>
        </div>

        <!-- Products Display Section -->
        <div class="product-grid" id="productGrid">
            <!-- Products will load dynamically here -->
        </div>

        <!-- Hidden Admin Panel -->
        <div class="admin-panel" id="adminPanel">
            <h2>Admin Area</h2>
            <div id="loginSection">
                <input type="password" id="adminPassword" placeholder="Enter Admin Password">
                <button class="action-btn" onclick="loginAdmin()">Login</button>
            </div>
            
            <div id="addProductSection" style="display: none;">
                <h3>Add New Perfume</h3>
                <input type="text" id="perfumeName" placeholder="Perfume Name (e.g. Bakrat / Khamra)">
                <input type="number" id="perfumePricePkr" placeholder="Price in PKR (e.g. 8950)">
                <input type="number" id="perfumePriceUsd" placeholder="Price in USD (e.g. 35)">
                
                <label style="font-size: 13px; color: #00e5ff; font-weight: bold;">Option 1: Pick Image from Mobile Gallery / Camera</label>
                <input type="file" id="perfumeImageFile" accept="image/*">
                
                <div class="or-text">— OR (یا پھر) —</div>
                
                <label style="font-size: 13px; color: #00e5ff; font-weight: bold;">Option 2: Paste Full Web Image Link (https://...)</label>
                <input type="text" id="perfumeImageUrl" placeholder="Paste full link like https://example.com/perfume.jpg">

                <button class="action-btn" onclick="addPerfume()">Save Product Online</button>
                <button class="logout-btn" onclick="logoutAdmin()">Logout</button>
            </div>
        </div>
    </div>

    <script>
        const JSONBIN_API_KEY = '$2a$10$d3QbxfNLV.PiNAbuaFFa/.U6EFvtgFpt0fZkres1qsVXt5SdCjmq';
        const JSONBIN_BIN_ID = '6aa68542ac6210605ac790b8';
        const JSONBIN_URL = `https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}`;
        const WHATSAPP_NUMBER = '923357290695';

        const ADMIN_SECRET = '∆∆∆∆∆¢|₹√45';
        let isAdminLoggedIn = false;

        async function loadProductsOnline() {
            try {
                const res = await fetch(JSONBIN_URL + '/latest', {
                    headers: { 'X-Master-Key': JSONBIN_API_KEY }
                });
                const data = await res.json();
                const perfumes = (data.record && data.record.perfumes) ? data.record.perfumes : [];
                renderProducts(perfumes);
            } catch (error) {
                console.error('Error loading products:', error);
            }
        }

        function renderProducts(perfumes) {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = '';
            if (perfumes.length === 0) {
                grid.innerHTML = '<p style="text-align: center; color: #00e5ff; width: 100%; font-weight: bold;">کوئی پروڈکٹ موجود نہیں ہے۔</p>';
                return;
            }
            perfumes.forEach((p, index) => {
                const waMessage = encodeURIComponent(
                    `Hello, I want to order:\n*Product:* ${p.name} (0% Alcohol)\n*Price:* PKR ${p.pkr} / USD ${p.usd}`
                );
                grid.innerHTML += `
                    <div class="product-card">
                        <div>
                            <img src="${p.image}" alt="${p.name}">
                            <h3>${p.name}</h3>
                            <div class="alcohol-tag">0% Alcohol</div>
                            <p>PKR ${p.pkr} &nbsp;|&nbsp; USD ${p.usd}</p>
                        </div>
                        <div>
                            <a class="order-btn" href="https://wa.me/${WHATSAPP_NUMBER}?text=${waMessage}" target="_blank">
                                Order on WhatsApp
                            </a>
                            ${isAdminLoggedIn ? `<button class="delete-btn" onclick="deletePerfume(${index})">Delete Product</button>` : ''}
                        </div>
                    </div>
                `;
            });
        }

        function toggleAdminPanel() {
            const panel = document.getElementById('adminPanel');
            panel.style.display = (panel.style.display === 'block') ? 'none' : 'block';
        }

        function loginAdmin() {
            const inputPass = document.getElementById('adminPassword').value;
            if (inputPass === ADMIN_SECRET) {
                isAdminLoggedIn = true;
                document.getElementById('loginSection').style.display = 'none';
                document.getElementById('addProductSection').style.display = 'block';
                loadProductsOnline();
                alert('لاگ ان کامیاب ہو گیا ہے!');
            } else {
                alert('غلط پاسورڈ! براہ کرم درست پاسورڈ درج کریں۔');
            }
        }

        function logoutAdmin() {
            isAdminLoggedIn = false;
            document.getElementById('loginSection').style.display = 'block';
            document.getElementById('addProductSection').style.display = 'none';
            document.getElementById('adminPassword').value = '';
            loadProductsOnline();
        }

        function compressImageFile(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = function (event) {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = function () {
                        const canvas = document.createElement('canvas');
                        const maxSize = 300;
                        let width = img.width;
                        let height = img.height;
                        if (width > height) {
                            if (width > maxSize) { height *= maxSize / width; width = maxSize; }
                        } else {
                            if (height > maxSize) { width *= maxSize / height; height = maxSize; }
                        }
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', 0.6));
                    };
                };
            });
        }

        async function addPerfume() {
            const name = document.getElementById('perfumeName').value.trim();
            const pkr = document.getElementById('perfumePricePkr').value.trim();
            const usd = document.getElementById('perfumePriceUsd').value.trim();
            const imageFile = document.getElementById('perfumeImageFile').files[0];
            const imageUrlInput = document.getElementById('perfumeImageUrl').value.trim();

            if (!name || !pkr || !usd || (!imageFile && !imageUrlInput)) {
                alert('براہ کرم نام، قیمت اور یا تو گیلری سے تصویر منتخب کریں یا ویب لنک ڈالیں!');
                return;
            }

            try {
                let finalImageSource = imageUrlInput;

                if (imageFile) {
                    finalImageSource = await compressImageFile(imageFile);
                }

                const res = await fetch(JSONBIN_URL + '/latest', {
                    headers: { 'X-Master-Key': JSONBIN_API_KEY }
                });
                const currentData = await res.json();
                let perfumes = (currentData.record && currentData.record.perfumes) ? currentData.record.perfumes : [];

                perfumes.push({
                    name: name,
                    pkr: pkr,
                    usd: usd,
                    image: finalImageSource
                });

                const putRes = await fetch(JSONBIN_URL, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Master-Key': JSONBIN_API_KEY
                    },
                    body: JSON.stringify({ perfumes: perfumes })
                });

                if (!putRes.ok) {
                    alert('پروڈکٹ سیو کرنے میں مسئلہ آیا ہے۔');
                    return;
                }

                alert('پروڈکٹ کامیابی سے آن لائن محفوظ ہو گئی ہے!');
                document.getElementById('perfumeName').value = '';
                document.getElementById('perfumePricePkr').value = '';
                document.getElementById('perfumePriceUsd').value = '';
                document.getElementById('perfumeImageFile').value = '';
                document.getElementById('perfumeImageUrl').value = '';
                loadProductsOnline();
            } catch (err) {
                alert('نیٹ ورک یا تصویر کا مسئلہ ہے، دوبارہ کوشش کریں!');
            }
        }

        async function deletePerfume(index) {
            if (!confirm('کیا آپ واقعی اس پروڈکٹ کو ڈیلیٹ کرنا چاہتے ہیں؟')) return;

            try {
                const res = await fetch(JSONBIN_URL + '/latest', {
                    headers: { 'X-Master-Key': JSONBIN_API_KEY }
                });
                const currentData = await res.json();
                let perfumes = (currentData.record && currentData.record.perfumes) ? currentData.record.perfumes : [];
                perfumes.splice(index, 1);

                await fetch(JSONBIN_URL, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Master-Key': JSONBIN_API_KEY
                    },
                    body: JSON.stringify({ perfumes: perfumes })
                });

                alert('پروڈکٹ ڈیلیٹ کر دی گئی ہے!');
                loadProductsOnline();
            } catch (err) {
                alert('ڈیلیٹ کرنے میں مسئلہ آیا ہے۔');
            }
        }

        window.onload = function() {
            loadProductsOnline();
        };
    </script>
</body>
</html>
