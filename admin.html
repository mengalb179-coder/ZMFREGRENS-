<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZM Collection - ایڈمن پینل</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .admin-card {
            background: #1e293b;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 400px;
        }
        h2 {
            text-align: center;
            color: #f59e0b;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: #cbd5e1;
        }
        input[type="text"], input[type="number"], input[type="file"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #475569;
            background: #0f172a;
            color: #fff;
            border-radius: 6px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #f59e0b;
            color: #0f172a;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background: #d97706;
        }
        #status {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="admin-card">
        <h2>نیا پروڈکٹ شامل کریں</h2>
        <form id="productForm">
            <div class="form-group">
                <label>پروڈکٹ کا نام (Name)</label>
                <input type="text" id="name" required placeholder="مثلاً: ZM Udula">
            </div>
            <div class="form-group">
                <label>قیمت (Price in Rs)</label>
                <input type="number" id="price" required placeholder="مثلاً: 2500">
            </div>
            <div class="form-group">
                <label>تصویر منتخب کریں (Image)</label>
                <input type="file" id="imageFile" accept="image/*" required>
            </div>
            <button type="submit" id="submitBtn">پروڈکٹ اپ لوڈ کریں</button>
        </form>
        <div id="status"></div>
    </div>
